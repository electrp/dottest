[plugins]
enabled = [
    "raycursive/niri-displays",
    "samuelskovbakke/calculator-plus",
    "tordex/nvtop",
    "weinguyen/procmon",
    "decksters-lab/palette-creator",
    "theblackdon/theme-switcher",
    "prponkshe/umbriel-displays",
    "noctalia/umbriel-companion"
]

[shell]
avatar_path = "/home/will/face.webp"
corner_radius_scale = 1.0500000156462193
umbriel_audio_provider_enabled = true

    [shell.animation]
    speed = 2.0000000298023224

    [shell.launcher]
    app_grid = true
    compact = true
    layout = "simple"
    show_app_actions = true

    [shell.shadow]
    alpha = 0.52999998815357685

[theme]
builtin = "Tokyo-Night"
community_palette = "Gruvbox Material Hard"
mode = "dark"
source = "community"
wallpaper_scheme = "vibrant"

    [theme.templates]
    builtin_ids = [ "alacritty", "gtk3", "gtk4", "luciole", "niri" ]
    community_ids = [ "pywalfox", "vscode", "prismlauncher" ]

        [theme.templates.user.palette_creator_live]
        input_path = "/home/will/.local/state/noctalia/plugins/materialized/community/palette-creator/templates/live-snapshot.tpl"
        output_path = "/home/will/.local/state/noctalia/plugin-data/kyle-palette-creator/live-snapshot.json"

[wallpaper]
directory = "~/.backgrounds"
enabled = true

    [wallpaper.default]
    path = "/home/will/.backgrounds/bubblebear.png"

    [wallpaper.last]
    path = "/home/will/.backgrounds/bubblebear.png"

    [wallpaper.monitors.DP-1]
    path = "/home/will/.backgrounds/bubblebear.png"

    [wallpaper.monitors.DP-2]
    path = "/home/will/.backgrounds/bubblebear.png"

    [wallpaper.monitors.DP-3]
    path = "/home/will/.backgrounds/bubblebear.png"

[widget.bar]
type = "raycursive/niri-displays:bar"

[widget.bar_2]
type = "prponkshe/umbriel-displays:bar"

[widget.bar_3]
type = "noctalia/umbriel-companion:bar"

[widget.session]
enabled = false

[widget.taskbar]
scale = 0.94999999999999996
show_window_title = true

[widget.widget]
enabled = false
type = "weinguyen/procmon:widget"

[widget.widget_2]
enabled = false
type = "tordex/nvtop:widget"

[widget.workspaces]
pill_scale = 0.90000000000000002
