[bar]
order = [ "default", "bottom" ]

    [bar.bottom]
    background_opacity = 0.0
    capsule = true
    center = [ "taskbar" ]
    compositor_blur = false
    enabled = false
    end = []
    padding = 12
    position = "bottom"
    reserve_space = false
    smart_auto_hide = true
    start = []

    [bar.default]
    capsule = true
    capsule_border_width = 0.5
    center = [ "clock", "bar_3" ]
    compositor_blur = false
    end = [
        "bar_2",
        "widget_2",
        "widget",
        "bar",
        "media",
        "tray",
        "notifications",
        "clipboard",
        "network",
        "bluetooth",
        "volume",
        "brightness",
        "battery",
        "control-center",
        "session"
    ]
    shadow = false
    start = [ "launcher", "wallpaper", "workspaces", "taskbar" ]
    widget_spacing = 0

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [
    "lockscreen-login-box@DP-3",
    "lockscreen-login-box@DP-2",
    "lockscreen-login-box@DP-1",
    "lockscreen-login-box@WL-1",
    "lockscreen-login-box@winit"
